name: Prepare module release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-component version (for example 5.0.0)
        required: true
        type: string
      prerelease:
        description: Optional lowercase prerelease label (for example beta1)
        type: string
        default: ''
      issue:
        description: Open issue number describing this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-module-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: windows-2025
    steps:
      - name: Require automation token and open issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          ISSUE: ${{ inputs.issue }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Dispatch release preparation from main." }
          if (-not $env:GH_TOKEN) { throw "Configure PAT with contents and pull request write access so release PR checks are triggered." }
          if ($env:ISSUE -notmatch "^#?[1-9][0-9]*$") { throw "Issue must be an open issue number." }
          $IssueNumber = $env:ISSUE.TrimStart("#")
          $State = gh issue view $IssueNumber --repo "$env:GITHUB_REPOSITORY" --json state --jq .state
          if ($LASTEXITCODE -ne 0 -or $State -ne "OPEN") { throw "The release must reference an open issue." }
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PAT }}
          fetch-depth: 0
      - name: Prepare release metadata
        id: release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = "Stop"
          $Metadata = ./ci/Update-Release.ps1 -Version $env:VERSION -Prerelease $env:PRERELEASE
          "version=$($Metadata.FullVersion)" >> $env:GITHUB_OUTPUT
          "branch=release/$($Metadata.FullVersion)" >> $env:GITHUB_OUTPUT
      - name: Validate release preparation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tests/Install-Pester.ps1
          Import-Module ./VcRedist/VcRedist.psd1 -Force
          $Config = New-PesterConfiguration
          $Config.Run.Path = @("./tests/Module.Tests.ps1", "./tests/CI")
          $Config.Run.Throw = $true
          Invoke-Pester -Configuration $Config
      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPGKEY }}
          passphrase: ${{ secrets.GPGPASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: ${{ secrets.COMMIT_NAME }}
          git_committer_email: ${{ secrets.COMMIT_EMAIL }}
      - name: Commit release branch and open pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          ISSUE: ${{ inputs.issue }}
        run: |
          $ErrorActionPreference = "Stop"
          git switch -c $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Could not create the release branch." }
          git add VcRedist/VcRedist.psd1 docs/changelog.md docs/versions.md
          git commit -m "Prepare VcRedist $env:RELEASE_VERSION" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit release changes." }
          git push --set-upstream origin $env:RELEASE_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Could not push release branch. If it already exists, use its PR instead of rerunning preparation." }
          $IssueNumber = $env:ISSUE.TrimStart("#")
          $Body = Get-Content ./.github/PULL_REQUEST_TEMPLATE.md -Raw
          $Body = $Body.Replace("Please describe your pull request in detail.", "Prepare VcRedist $env:RELEASE_VERSION with matching manifest, changelog and bundled redistributable documentation.")
          $Body = $Body.Replace("_Please link to the issue here_", "Related to #$IssueNumber")
          $Body = $Body.Replace("Why is this change required? What problem does it solve?", "Separate version preparation from development validation and require release validation before publishing.")
          $Body += "`n`nPreparation validation: ``Invoke-Pester -Configuration `$Config`` passed on Windows PowerShell 7, selecting ``tests/Module.Tests.ps1`` and ``tests/CI`` with ``Run.Throw = `$true``. Full CI is pending; merge only after Validation gate passes.`n"
          $BodyPath = Join-Path $env:RUNNER_TEMP "release-pr-body.md"
          Set-Content -LiteralPath $BodyPath -Value $Body -Encoding "utf8"
          $Existing = gh pr list --repo "$env:GITHUB_REPOSITORY" --head $env:RELEASE_BRANCH --base main --state open --json number --jq '.[0].number'
          if ($LASTEXITCODE -ne 0) { throw "Could not find existing release PRs." }
          if ($Existing) {
              gh pr edit $Existing --repo "$env:GITHUB_REPOSITORY" --body-file $BodyPath
          }
          else {
              gh pr create --repo "$env:GITHUB_REPOSITORY" --base main --head $env:RELEASE_BRANCH --title "Release VcRedist $env:RELEASE_VERSION" --body-file $BodyPath
          }
          if ($LASTEXITCODE -ne 0) { throw "Release branch was pushed but the PR could not be created or updated. Open it manually." }
