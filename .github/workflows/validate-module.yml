name: Validate module

on:
  push:
    branches: ['**']
    paths: ['VcRedist/**', 'tests/**']
  pull_request:
    branches: [main]
    paths: ['VcRedist/**', 'tests/**']
  workflow_dispatch:
    inputs:
      run_intune:
        description: Run Intune-tagged tests, including live integration tests (requires tenant credentials)
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      run_intune:
        type: boolean
        default: false
    secrets:
      TENANT_ID:
        required: false
      CLIENT_ID:
        required: false
      CLIENT_SECRET:
        required: false

permissions:
  contents: read

jobs:
  stage-module:
    name: Stage module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: VcRedist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  run-pester:
    name: Pester (${{ matrix.os }}, ${{ matrix.shell }})
    needs: stage-module
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: VcRedist/
      - name: Run Pester tests
        run: ./ci/Test-Module.ps1 -ResultName "${{ matrix.os }}-${{ matrix.shell }}"
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            TestResults-${{ matrix.os }}-${{ matrix.shell }}.xml
            CodeCoverage-${{ matrix.os }}-${{ matrix.shell }}.xml
          if-no-files-found: warn
      - name: Publish Pester test results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always() && matrix.os == 'windows-2025' && matrix.shell == 'powershell' && github.event_name != 'pull_request'
        with:
          files: TestResults-${{ matrix.os }}-${{ matrix.shell }}.xml

  analyzer:
    needs: stage-module
    uses: ./.github/workflows/analyzer.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  intune:
    name: Live Intune tests
    if: inputs.run_intune == true && github.event_name != 'pull_request'
    needs: [run-pester, analyzer]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: VcRedist/
      - name: Run live Intune tests
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: ./ci/Test-Module.ps1 -Intune -ResultName "intune"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pester-test-results-intune
          path: TestResults-intune.xml

  validation-gate:
    name: Validation gate
    if: always()
    needs: [stage-module, run-pester, analyzer, intune]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          STAGE: ${{ needs.stage-module.result }}
          TESTS: ${{ needs.run-pester.result }}
          ANALYZER: ${{ needs.analyzer.result }}
          INTUNE: ${{ needs.intune.result }}
          RUN_INTUNE: ${{ inputs.run_intune || false }}
        run: |
          test "$STAGE" = success
          test "$TESTS" = success
          test "$ANALYZER" = success
          if [ "$RUN_INTUNE" = true ]; then
            test "$INTUNE" = success
          fi
