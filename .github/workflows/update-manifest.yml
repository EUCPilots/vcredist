name: Update module manifest

on:
  workflow_dispatch:
  push:
#    branches: [ manifest-update ] 
    paths:
      - ci/Update-Manifest.ps1
  schedule:
    - cron: '0 18 * * *'

env:
  MANIFEST_FILE: ${{ github.workspace }}\VcRedist\VisualCRedistributables.json

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifest-amd64:
    runs-on: windows-2025
    name: 'Update AMD64 manifest entries'
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure manifest-update branch exists
        shell: pwsh
        run: |
          git fetch origin
          if (git ls-remote --heads origin manifest-update) {
            git switch manifest-update
            git pull origin manifest-update
          }
          else {
            git switch -c manifest-update
            git push --set-upstream origin manifest-update
          }

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPGKEY }}
          passphrase: ${{ secrets.GPGPASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          git_committer_name: ${{ secrets.COMMIT_NAME }}
          git_committer_email: ${{ secrets.COMMIT_EMAIL }}

      - name: Validate VcRedist 14 x86 and x64
        shell: pwsh
        run: |
          Import-Module "${{ github.workspace }}\VcRedist" -Force
          Get-InstalledVcRedist | Uninstall-VcRedist -Confirm:$false -Verbose
          New-Item -Path "$env:RUNNER_TEMP\VcRedist" -ItemType "Directory" -Force | Out-Null
          $params = @{
              Release      = "14"
              Architecture = @("x86", "x64")
              Path         = "$env:RUNNER_TEMP\VcRedist"
              VcManifest   = "${{ env.MANIFEST_FILE }}"
          }
          . ${{ github.workspace }}\ci\Update-Manifest.ps1 @params

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update manifest AMD64 ${{ github.run_number }}"
          commit_user_name: ${{ secrets.COMMIT_NAME }}
          commit_user_email: ${{ secrets.COMMIT_EMAIL }}

  update-manifest:
    needs: update-manifest-amd64
    runs-on: windows-11-arm
    name: 'Update manifest'
    outputs:
      changes_detected: ${{ steps.commit.outputs.changes_detected }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Ensure we can work on manifest-update whether or not it already exists
      - name: Ensure manifest-update branch exists
        shell: pwsh
        run: |
          git fetch origin

          if (git ls-remote --heads origin manifest-update) {
            git switch manifest-update
            git pull origin manifest-update
          }
          else {
            git switch -c manifest-update
            git push --set-upstream origin manifest-update
          }

      # Pull latest changes from manifest-update branch
      - name: Pull latest changes
        shell: pwsh
        run: |
          git pull origin manifest-update

      # Import GPG key so that we can sign the commit
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPGKEY }}
          passphrase: ${{ secrets.GPGPASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          git_committer_name: ${{ secrets.COMMIT_NAME }}
          git_committer_email: ${{ secrets.COMMIT_EMAIL }}

      # Uninstall existing VcRedists
      - name: Uninstall VcRedists
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\VcRedist -Force
          Get-InstalledVcRedist | Uninstall-VcRedist -Confirm:$False -Verbose

      # Validate VcRedist 14 and update the manifest
      - name: Validate VcRedist 14 arm64
        shell: pwsh
        run: |
          $Release = "14"
          $Architecture = "arm64"
          Import-Module "${{ github.workspace }}\VcRedist" -Force
          New-Item -Path "$env:RUNNER_TEMP\VcRedist" -ItemType "Directory" -ErrorAction "SilentlyContinue" | Out-Null
          $params = @{
              Release      = $Release
              Architecture = $Architecture
              Path         = "$env:RUNNER_TEMP\VcRedist"
              VcManifest   = "${{ env.MANIFEST_FILE }}"
          }
          . ${{ github.workspace }}\ci\Update-Manifest.ps1 @params

      # Format the date number for the commit message
      - name: Get date
        id: get-date
        shell: pwsh
        run: |
          echo "date=$(Get-Date -Format "yyyy-MM-dd")" >> $env:GITHUB_OUTPUT

      # Commit changes to the manifest
      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update manifest ARM64 ${{ steps.get-date.outputs.date }}.${{ github.run_number }}"
          commit_user_name: ${{ secrets.COMMIT_NAME }}
          commit_user_email: ${{ secrets.COMMIT_EMAIL }}

      - name: "Run if changes have been detected"
        if: steps.commit.outputs.changes_detected == 'true'
        run: echo "Changes committed."

      - name: "Run if no changes have been detected"
        if: steps.commit.outputs.changes_detected == 'false'
        run: echo "No changes detected."

  create-pull-request:
    runs-on: ubuntu-latest
    name: 'Create pull request'
    needs:
      - update-manifest-amd64
      - update-manifest
    if: needs.update-manifest-amd64.outputs.changes_detected == 'true' || needs.update-manifest.outputs.changes_detected == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: manifest-update
          fetch-depth: 0

      - name: Generate pull request body
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          DIFF_RANGE="origin/main...HEAD"

          if ! git merge-base origin/main HEAD >/dev/null; then
            DIFF_RANGE="origin/main..HEAD"
          fi

          {
            echo "## Automated manifest update"
            echo
            echo "This PR was created by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "### Commits in manifest-update not in main"
            if git log --oneline origin/main..HEAD | grep -q .; then
              git log --oneline origin/main..HEAD
            else
              echo "No commit summary available."
            fi
            echo
            echo "### Files changed (vs main)"
            if git diff --name-status "$DIFF_RANGE" | grep -q .; then
              git diff --name-status "$DIFF_RANGE"
            else
              echo "No file changes detected."
            fi
          } > pr-body.md

      - name: Create or update pull request to main
        id: manage_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_CREATE_TOKEN: ${{ secrets.PAT }}
        shell: bash
        run: |
          TITLE="Automated manifest update (${GITHUB_RUN_NUMBER})"
          EXISTING_PR_NUMBER=$(gh pr list --base main --head manifest-update --state open --json number --jq '.[0].number')
          CREATED_PR_URL=""

          if [[ -n "$EXISTING_PR_NUMBER" ]]; then
            gh pr edit "$EXISTING_PR_NUMBER" --title "$TITLE" --body-file pr-body.md
            echo "Updated PR #$EXISTING_PR_NUMBER"
          elif [[ -n "$PR_CREATE_TOKEN" ]]; then
            CREATED_PR_URL=$(GH_TOKEN="$PR_CREATE_TOKEN" gh pr create --base main --head manifest-update --title "$TITLE" --body-file pr-body.md)
            echo "created_pr=true" >> "$GITHUB_OUTPUT"
            echo "created_pr_url=$CREATED_PR_URL" >> "$GITHUB_OUTPUT"
          else
            echo "created_pr=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No open pull request exists from manifest-update to main, and repository secret PAT is not configured. GitHub Actions is not permitted to create pull requests with GITHUB_TOKEN in this repository. To enable automatic PR creation, configure a PAT secret named PAT with repository contents and pull request write access."
          fi

      - name: Notify when PR is created
        if: steps.manage_pr.outputs.created_pr == 'true'
        shell: bash
        run: |
          echo "::notice title=Pull request created::Created pull request: ${{ steps.manage_pr.outputs.created_pr_url }}"
