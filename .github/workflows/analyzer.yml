name: Run PSScriptAnalyzer

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./ci/Install-Analyzer.ps1
          $Results = @(Invoke-ScriptAnalyzer -Path ./VcRedist -Recurse -Settings ./.rules/PSScriptAnalyzerSettings.psd1)
          $Results | Format-Table -AutoSize
          if ($Results.Count -gt 0) { throw "PSScriptAnalyzer reported $($Results.Count) findings." }
